<article class="note-card">
  <a class="img" href="{{ include.post.url | relative_url }}" tabindex="-1" aria-hidden="true">{% if include.post.image %}<img src="{{ include.post.image | relative_url }}" alt=""{% if include.post.image_position %} style="object-position:{{ include.post.image_position }}"{% endif %} loading="lazy">{% else %}<span class="ph"></span>{% endif %}</a>
  <span class="date">{{ include.post.date | date: "%-d %B %Y" }}</span>
  <a class="title" href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
  <span class="excerpt">{{ include.post.excerpt | strip_html | strip_newlines | truncatewords: 34 }}</span>
  {% include tag-chips.html tags=include.post.tags %}
  <a class="more" href="{{ include.post.url | relative_url }}">Read more</a>
</article>
